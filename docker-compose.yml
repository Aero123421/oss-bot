# P0: Hono API + SQLite + Chat UI (web). No Postgres. No Redis.
# Bot runtime = Docker. Mount docker.sock only via docker-compose.dev.yml (DEV).
# DOCKER_HOST is NOT set here — only in the dev overlay.
#
# Risk: sock ≈ host root. Production must NOT use the dev overlay.
# Rollback: previous compose + `docker compose up -d --build`
# Data: `docker compose down` keeps volume; `down -v` DESTROYS SQLite.

name: oss-bot

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"
      DATABASE_PATH: /app/data/oss-bot.sqlite
      BOT_RUNTIME: docker
    volumes:
      - ossbot-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ossbot-data:
